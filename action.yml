name: 'SemRelease'
author: 'Thanh Nguyen <btnguyen2k(at)gmail(dot)com>'
description: 'Publish releases using tags, following sematic versioning'
branding:
  icon: 'git-pull-request'
  color: 'red'
inputs:
  github-token:
    description: 'Token with Contents write permission to publish, plus Actions read permission when attaching artifacts'
    required: true
  dry-run:
    description: 'Set to true to calculate version and notes without creating tags or releases'
    required: false
    default: 'false'
  target-sha:
    description: 'Commit SHA to release; defaults to the event SHA and must be a tip or ancestor of a configured branch'
    required: false
    default: ''
  tag-prefix:
    description: 'Prefix for version lookup and release tags, e.g. v for v1.2.3'
    required: false
    default: 'v'
  tag-major-release:
    description: 'Set to true to also create or move the major-version alias, e.g. v1'
    required: false
    default: 'false'
  tag-minor-release:
    description: 'Set to true to also create or move the minor-version alias, e.g. v1.2'
    required: false
    default: 'false'
  branches:
    description: 'Comma-separated branches for target validation and commit scanning, e.g. main,release,dev'
    required: false
    default: 'main,master'
  path:
    description: 'Repository-relative file or directory path to filter commit scanning; empty means all paths'
    required: false
    default: ''
  tag-only:
    description: 'Set to true to create tags without publishing a GitHub release; artifact inputs are ignored'
    required: false
    default: 'false'
  artifact-ids:
    description: 'Current-repository Actions artifact IDs to attach as-is; separated by commas, semicolons or whitespace'
    required: false
    default: ''
  artifact-run-id:
    description: 'Expected source run for artifacts; defaults to the current run and must match the release target'
    required: false
    default: ''
outputs:
  releaseVersion:
    description: 'The released version string'
  releaseNotes:
    description: 'The release notes'
  result:
    description: 'Action result, either FAILED, SKIPPED, or SUCCESS'
runs:
  using: 'node24'
  main: 'dist/index.cjs'
