name: "test"

on:
  push:
  pull_request:
    types: [ opened, edited, reopened, synchronize, review_requested ]
  workflow_call:
    inputs:
      target-sha:
        description: 'Pinned commit SHA to test; defaults to the workflow context SHA'
        required: false
        type: string
        default: ''
      packaged:
        description: 'Test the committed action bundle without rebuilding it'
        required: false
        type: boolean
        default: false

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      target-sha: ${{ steps.capture.outputs.target-sha }}
      action-target-sha: ${{ steps.capture.outputs.action-target-sha }}
      action-branch: ${{ steps.capture.outputs.action-branch }}
    steps:
      - name: Capture pinned commit SHA
        id: capture
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target-sha || github.sha }}
          PR_BASE_SHA: ${{ !inputs.target-sha && github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          PR_BASE_BRANCH: ${{ !inputs.target-sha && github.event_name == 'pull_request' && github.event.pull_request.base.ref || '' }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::target-sha must be a full 40-character commit SHA"
            exit 1
          fi
          printf 'target-sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"
          ACTION_TARGET_SHA="${PR_BASE_SHA:-$TARGET_SHA}"
          if [[ ! "$ACTION_TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::Action target must be a full 40-character commit SHA"
            exit 1
          fi
          printf 'action-target-sha=%s\n' "$ACTION_TARGET_SHA" >> "$GITHUB_OUTPUT"
          printf 'action-branch=%s\n' "$PR_BASE_BRANCH" >> "$GITHUB_OUTPUT"

  # lint
  lint:
    runs-on: ubuntu-latest
    needs: [pin]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  # unit tests
  units:
    runs-on: ubuntu-latest
    needs: [pin]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Dependencies
        run: npm ci
      - name: Run Tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run test
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # test the action itself
  test_non_auto:
    runs-on: ubuntu-latest
    needs: [pin, lint, units]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild the dist/ directory
        if: ${{ !inputs.packaged }}
        run: npm run prepare
      - name: Run Action (default branches)
        id: run-action-default
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-sha: ${{ needs.pin.outputs.action-target-sha }}
          dry-run: true
          tag-prefix: vt
          branches: ${{ needs.pin.outputs.action-branch || 'main, master, release, dev' }}
      - name: Check output (default branches)
        env:
          RESULT: ${{ steps.run-action-default.outputs.result }}
          VERSION: ${{ steps.run-action-default.outputs.releaseVersion }}
          RELEASE_NOTES: ${{ steps.run-action-default.outputs.releaseNotes }}
        run: |
          printf 'Result: %s\nVersion: %s\nRelease Notes: %s\n' "$RESULT" "$VERSION" "$RELEASE_NOTES"
          if [ "${RESULT}" == "SUCCESS" ]; then
            cp -f package.json package.json.bak
            sed -i -E "s/^(\s*\"version\"\s*:\s*)\"[^\"]+\"/\1\"${VERSION}\"/" package.json
            echo ---------- content of package.json ----------
            cat package.json
            cp -f package.json.bak package.json
          fi

  # test the action itself
  test_auto:
    runs-on: ubuntu-latest
    needs: [pin, lint, units]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild the dist/ directory
        if: ${{ !inputs.packaged }}
        run: npm run prepare
      - name: Run Action (branch scan)
        id: run-action-branches
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-sha: ${{ needs.pin.outputs.action-target-sha }}
          dry-run: true
          branches: ${{ needs.pin.outputs.action-branch || 'main, release, dev, not-exists' }}
          tag-prefix: va
      - name: Check output (branch scan)
        env:
          RESULT: ${{ steps.run-action-branches.outputs.result }}
          VERSION: ${{ steps.run-action-branches.outputs.releaseVersion }}
          RELEASE_NOTES: ${{ steps.run-action-branches.outputs.releaseNotes }}
        run: |
          printf 'Result: %s\nVersion: %s\nRelease Notes: %s\n' "$RESULT" "$VERSION" "$RELEASE_NOTES"
          if [ "${RESULT}" == "SUCCESS" ]; then
            DATE=`date +%Y-%m-%d`
            cp -f RELEASE-NOTES.md RELEASE-NOTES.md.bak
            cp -f package.json package.json.bak
            head -1 RELEASE-NOTES.md > .temp.md
            printf '\n## %s - v%s\n\n%s\n' "$DATE" "$VERSION" "$RELEASE_NOTES" >> .temp.md
            tail -n +2 RELEASE-NOTES.md >> .temp.md
            mv -f .temp.md RELEASE-NOTES.md
            echo ---------- content of RELEASE-NOTES.md ----------
            cat RELEASE-NOTES.md
            sed -i -E "s/^(\s*\"version\"\s*:\s*)\"[^\"]+\"/\1\"${VERSION}\"/" package.json
            echo ---------- content of package.json ----------
            cat package.json
            cp -f RELEASE-NOTES.md.bak RELEASE-NOTES.md
            cp -f package.json.bak package.json
          fi

  # test the action itself
  test_dry_run:
    runs-on: ubuntu-latest
    needs: [pin, lint, units]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild the dist/ directory
        if: ${{ !inputs.packaged }}
        run: npm run prepare
      - name: Run Action (dry-run)
        id: run-action-dry-run
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-sha: ${{ needs.pin.outputs.action-target-sha }}
          dry-run: true
          branches: ${{ needs.pin.outputs.action-branch || 'main, release, dev, not-exists' }}
          tag-prefix: v
      - name: Check output (dry-run)
        env:
          RESULT: ${{ steps.run-action-dry-run.outputs.result }}
          VERSION: ${{ steps.run-action-dry-run.outputs.releaseVersion }}
          RELEASE_NOTES: ${{ steps.run-action-dry-run.outputs.releaseNotes }}
        run: |
          printf 'Result: %s\nVersion: %s\nRelease Notes: %s\n' "$RESULT" "$VERSION" "$RELEASE_NOTES"
          if [ "${RESULT}" == "SUCCESS" ]; then
            DATE=`date +%Y-%m-%d`
            cp -f RELEASE-NOTES.md RELEASE-NOTES.md.bak
            cp -f package.json package.json.bak
            head -1 RELEASE-NOTES.md > .temp.md
            printf '\n## %s - v%s\n\n%s\n' "$DATE" "$VERSION" "$RELEASE_NOTES" >> .temp.md
            tail -n +2 RELEASE-NOTES.md >> .temp.md
            mv -f .temp.md RELEASE-NOTES.md
            echo ---------- content of RELEASE-NOTES.md ----------
            cat RELEASE-NOTES.md
            sed -i -E "s/^(\s*\"version\"\s*:\s*)\"[^\"]+\"/\1\"${VERSION}\"/" package.json
            echo ---------- content of package.json ----------
            cat package.json
            cp -f RELEASE-NOTES.md.bak RELEASE-NOTES.md
            cp -f package.json.bak package.json
          fi
