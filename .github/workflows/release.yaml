# Automatically release a new version when a PR is merged to branch `release`
name: 'release'

on:
  pull_request:
    types: [ closed ]
    branches: [ release ]

env:
  BRANCH_TO_RELEASE: 'release'
  TAG_PREFIX: 'v'
  FILE_CHANGELOG: 'RELEASE-NOTES.md'

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  pin:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      target-sha: ${{ steps.capture.outputs.target-sha }}
    steps:
      - name: Capture pinned commit SHA
        id: capture
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::target-sha must be a full 40-character commit SHA"
            exit 1
          fi
          printf 'target-sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"

  callTest:
    needs: [ pin ]
    uses: ./.github/workflows/test.yaml
    with:
      target-sha: ${{ needs.pin.outputs.target-sha }}

  dryrun:
    runs-on: ubuntu-latest
    needs: [ pin, callTest ]
    if: |
      github.event.pull_request.merged == true
    outputs:
      RESULT: ${{ steps.release_dry_run.outputs.result }}
      VERSION: ${{ steps.release_dry_run.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.release_dry_run.outputs.releaseNotes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild the dist/ directory
        run: npm run prepare
      - name: Release (dry-run)
        id: release_dry_run
        uses: ./ # The repo itself is the action, and is always the latest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-sha: ${{ needs.pin.outputs.target-sha }}
          dry-run: true
          tag-major-release: true
          tag-minor-release: true
          branches: ${{ env.BRANCH_TO_RELEASE }}

  prepare:
    runs-on: ubuntu-latest
    if: |
      needs.dryrun.outputs.RESULT == 'SUCCESS'
    needs: [ pin, dryrun ]
    outputs:
      release-sha: ${{ steps.commit.outputs.release-sha }}
    permissions:
      contents: write # to push the prepared release commit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Update metadata
        env:
          VERSION: ${{ needs.dryrun.outputs.VERSION }}
          RELEASE_NOTES: ${{ needs.dryrun.outputs.RELEASE_NOTES }}
        run: |
          echo "🕘 Updating metadata..."
          DATE=$(date +%Y-%m-%d)
          if awk -v tag="${TAG_PREFIX}${VERSION}" '$1 == "##" && $3 == "-" && $4 == tag { found = 1 } END { exit !found }' "$FILE_CHANGELOG"; then
            echo "::error::Changelog already contains this version; inspect the earlier publication before retrying"
            exit 1
          fi
          head -1 "$FILE_CHANGELOG" > .temp.md
          printf '\n## %s - %s%s\n\n%s\n' "$DATE" "$TAG_PREFIX" "$VERSION" "$RELEASE_NOTES" >> .temp.md
          tail -n +2 "$FILE_CHANGELOG" >> .temp.md
          mv -f .temp.md "$FILE_CHANGELOG"

          echo "🕘 Updating VERSION string in file package.json..."
          sed -i -E "s/^(\s*\"version\"\s*:\s*)\"[^\"]+\"/\1\"${VERSION}\"/" package.json
          echo "---------- content of package.json ----------"
          cat package.json

          echo "🕘 Updating VERSION string in other files..."
          sed -i -E "s/<<VERSION>>/${TAG_PREFIX}${VERSION}/" ./*.md
          sed -i -E "s/<<VERSION>>/${TAG_PREFIX}${VERSION}/" ./src/*.js
          sed -i -E "s/<<VERSION>>/${TAG_PREFIX}${VERSION}/" ./test/*.js

          echo "✅ Done."
      - name: Build release bundle
        run: npm run prepare
      - name: Commit prepared release
        id: commit
        env:
          VERSION: ${{ needs.dryrun.outputs.VERSION }}
          SOURCE_SHA: ${{ needs.pin.outputs.target-sha }}
        run: |
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/${BRANCH_TO_RELEASE}" | cut -f1)
          if [ "$REMOTE_SHA" != "$SOURCE_SHA" ]; then
            echo "::error::Release branch advanced beyond the pinned source; refusing to publish stale preparation"
            exit 1
          fi
          git add -- dist/ package.json ./*.md src/ test/
          if ! git diff --cached --quiet; then
            git config user.email "<>"
            git config user.name "CI Build"
            git commit -m "Prepare release ${VERSION} [skip ci]"
          fi
          git push origin "HEAD:${BRANCH_TO_RELEASE}"
          printf 'release-sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Report preparation failure
        if: failure()
        run: echo "::warning::Release preparation failed. Inspect the release branch for a preparation commit before retrying; no automatic rollback was performed."

  testPrepared:
    needs: [prepare]
    uses: ./.github/workflows/test.yaml
    with:
      target-sha: ${{ needs.prepare.outputs.release-sha }}
      packaged: true

  release:
    runs-on: ubuntu-latest
    needs: [prepare, testPrepared, dryrun]
    outputs:
      RESULT: ${{ steps.semrelease.outputs.result }}
      VERSION: ${{ steps.semrelease.outputs.releaseVersion }}
      RELEASE_NOTES: ${{ steps.semrelease.outputs.releaseNotes }}
    permissions:
      contents: write
    steps:
      - name: Checkout prepared release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release-sha }}
      - name: Verify prepared release
        id: verify
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-sha: ${{ needs.prepare.outputs.release-sha }}
          dry-run: true
          tag-major-release: true
          tag-minor-release: true
          branches: ${{ env.BRANCH_TO_RELEASE }}
      - name: Check release plan and branch
        env:
          EXPECTED_VERSION: ${{ needs.dryrun.outputs.VERSION }}
          EXPECTED_NOTES: ${{ needs.dryrun.outputs.RELEASE_NOTES }}
          ACTUAL_RESULT: ${{ steps.verify.outputs.result }}
          ACTUAL_VERSION: ${{ steps.verify.outputs.releaseVersion }}
          ACTUAL_NOTES: ${{ steps.verify.outputs.releaseNotes }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release-sha }}
        run: |
          if [ "$ACTUAL_RESULT" != "SUCCESS" ] || [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ] || [ "$ACTUAL_NOTES" != "$EXPECTED_NOTES" ]; then
            echo "::error::Prepared release no longer matches the original release plan"
            exit 1
          fi
          REMOTE_SHA=$(git ls-remote --exit-code origin "refs/heads/${BRANCH_TO_RELEASE}" | cut -f1)
          if [ "$REMOTE_SHA" != "$RELEASE_SHA" ]; then
            echo "::error::Release branch advanced after preparation; inspect before retrying"
            exit 1
          fi
      - name: SemRelease
        id: semrelease
        uses: ./ # The repo itself is the action, and is always the latest
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          target-sha: ${{ needs.prepare.outputs.release-sha }}
          tag-major-release: true
          tag-minor-release: true
          branches: ${{ env.BRANCH_TO_RELEASE }}
      - name: Cleanup file .semrelease/this_release
        id: cleanup_release_metadata
        env:
          RESULT: ${{ steps.semrelease.outputs.result }}
          VERSION: ${{ steps.semrelease.outputs.releaseVersion }}
        run: |
          if [ "${RESULT}" == "SUCCESS" ]; then
            echo "🕘 Cleaning up file .semrelease/this_release..."
            echo "# This file has been cleaned up post-releasing version ${VERSION}." > .semrelease/this_release
            echo "# Generate its content quickly using the following command:" >> .semrelease/this_release
            echo "#   git log origin..HEAD | grep \"^\s\" > .semrelease/this_release" >> .semrelease/this_release
            git config --global user.email "<>"
            git config --global user.name "CI Build"
            git add -- .semrelease/this_release
            if ! git diff --cached --quiet -- .semrelease/this_release; then
              git commit -m "Cleanup file .semrelease/this_release post releasing version ${VERSION}" -- .semrelease/this_release
            fi
            git push origin "HEAD:${BRANCH_TO_RELEASE}"
            echo "✅ Done."
          else
            echo "❎ SKIPPED."
          fi

      - name: Report partial release failure
        if: failure()
        env:
          RELEASE_RESULT: ${{ steps.semrelease.outputs.result }}
        run: |
          if [ "${RELEASE_RESULT}" == "SUCCESS" ]; then
            echo "::warning::Release publication succeeded, but a later workflow step failed. Inspect the release and cleanup commit/push; complete the remaining cleanup manually before retrying. Do not delete the successful release or rerun publication blindly."
          else
            echo "::warning::Release workflow failed. Earlier steps may have pushed build or metadata commits, created tags/releases, or changed aliases. No automatic rollback was performed. Inspect failed-step logs and remote state; manually clean up or restore only changes from this run before retrying. Do not blindly delete pre-existing tags/releases or revert unrelated commits."
          fi

  mergeToMain:
    runs-on: ubuntu-latest
    if: |
      needs.release.outputs.RESULT == 'SUCCESS'
    needs: [ release ]
    permissions:
      pull-requests: write # to be able to create PRs or comment on released PRs
    steps:
      - uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.release.outputs.VERSION }}
          RELEASE_NOTES: ${{ needs.release.outputs.RELEASE_NOTES }}
        with:
          script: |
            const {data: pr} = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge to main after releasing new version ${process['env']['VERSION']}`,
              body: process['env']['RELEASE_NOTES'],
              head: process['env']['BRANCH_TO_RELEASE'],
              base: 'main',
              maintainer_can_modify: true,
            });
            console.log('✅ Created PR: ', pr);
      - name: Report post-release PR failure
        if: failure()
        run: |
          echo "::warning::Post-release PR creation failed; publication may already have succeeded. Inspect existing release-to-main PRs before retrying because a lost response may hide successful creation. Do not rerun or undo publication to resolve this PR failure."
