# Tests a root npm package and publishes to npm plus a GitHub release.
# Copy with npm-ci.yaml to .github/workflows; choose this OR npm-release-metadata.yaml.
# npmjs.com package Settings > Trusted publishing > GitHub Actions (existing package).
# Set owner/repo and filename npm-release.yaml (case-sensitive; no directory path).
# Allow npm publish, not only staging; leave Environment name blank for this sample.
# First publish after setup must occur within 2 days; recreate expired configurations.
# Bootstrap new packages separately; package.json repository.url must match this repo.
# Setup reference: https://docs.npmjs.com/trusted-publishers/
# Publishes a public package; no GitHub artifact upload is needed.
# Requires package-lock.json and a test script; the build script is optional.
# Uses commit history; keep .semrelease/this_release absent (file messages override history).
# Example prefixes: breaking change: = major, feat: = minor, fix: = patch.
name: npm release
env:
  RELEASE_BRANCH: release
# Triggered when a PR to the release branch is closed; unmerged PRs skip all jobs.
on:
  pull_request:
    types: [closed]
    # Keep in sync with RELEASE_BRANCH; trigger filters cannot use env expressions.
    branches: [release]
concurrency:
  group: npm-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  # Pin the merged commit once for CI and publication.
  pin:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      target-sha: ${{ steps.capture.outputs.target-sha }}
    steps:
      - name: Capture pinned commit SHA
        id: capture
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::target-sha must be a full 40-character commit SHA"
            exit 1
          fi
          printf 'target-sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"
  # Re-test that SHA and calculate the version without creating tags/releases.
  ci:
    needs: pin
    uses: ./.github/workflows/npm-ci.yaml
    with:
      target-sha: ${{ needs.pin.outputs.target-sha }}
  # Publish only a SUCCESS preview; SKIPPED or failed CI stops the release chain.
  release:
    needs: [pin, ci]
    if: needs.ci.outputs.result == 'SUCCESS'
    # npm trusted publishing requires a GitHub-hosted runner, not self-hosted.
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.status.outputs.published }}
      release-version: ${{ steps.publish.outputs.releaseVersion }}
      release-notes: ${{ steps.publish.outputs.releaseNotes }}
    # Contents write publishes the GitHub release; OIDC authorizes npm publishing.
    permissions:
      contents: write
      # Allows npm CLI to request a GitHub OIDC token automatically.
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.pin.outputs.target-sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Use latest stable npm; trusted publishing requires npm >=11.5.1.
      - run: npm install --global npm@latest
      # Private installs only: scope a read-only NODE_AUTH_TOKEN to this npm ci step.
      - run: npm ci
      - name: Publish GitHub release
        id: publish
        uses: btnguyen2k/action-semrelease@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ env.DRY_RUN || 'false' }}
          target-sha: ${{ needs.pin.outputs.target-sha }}
          branches: ${{ env.RELEASE_BRANCH }}
      # A dry run can return SUCCESS, but must not publish to npm or create a PR.
      - name: Record publication status
        id: status
        if: steps.publish.outputs.result == 'SUCCESS'
        shell: bash
        run: |
          DRY_RUN_VALUE="${DRY_RUN:-false}"
          if [[ "${DRY_RUN_VALUE,,}" =~ ^[[:space:]]*true[[:space:]]*$ ]] || [ -e .semrelease-dry-run ]; then
            echo "::notice::Dry run: skipping post-release changes"
            echo 'published=false' >> "$GITHUB_OUTPUT"
          else
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
      # Use the actual release version; do not commit package/version changes.
      # npm publish handles OIDC automatically; no npm login, auth action, or publish secret.
      # Public source repos also get provenance automatically; no --provenance needed.
      - name: Build and publish to npm
        if: steps.status.outputs.published == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.publish.outputs.releaseVersion }}
        run: |
          npm version "$VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm run build --if-present
          PUBLISH_ARGS=(--access public --registry https://registry.npmjs.org)
          if [[ "${VERSION%%+*}" == *-* ]]; then
            PUBLISH_ARGS+=(--tag next)
          fi
          npm publish "${PUBLISH_ARGS[@]}"
      - name: Report partial release failure
        if: failure()
        run: |
          echo "::warning::Release workflow failed; GitHub or npm publication may already have succeeded. Inspect both and finish missing publication manually; do not rerun blindly or undo a successful publication."
  # Open a PR only after GitHub and npm publication; never auto-merge.
  mergeToMain:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # Repository Actions settings must allow creating pull requests.
    permissions:
      pull-requests: write
    steps:
      - name: Create release-to-main PR
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.release.outputs.release-version }}
          RELEASE_NOTES: ${{ needs.release.outputs.release-notes }}
        with:
          script: |
            const {owner, repo} = context.repo
            const {data: existing} = await github.rest.pulls.list({
              owner, repo,
              state: 'open',
              head: `${owner}:${process.env.RELEASE_BRANCH}`,
              base: 'main',
              per_page: 1,
            })
            if (existing.length) {
              core.info(`Release-to-main PR already exists: ${existing[0].html_url}`)
              return
            }
            const {data: pr} = await github.rest.pulls.create({
              owner, repo,
              title: `Merge to main after releasing version ${process.env.VERSION}`,
              body: process.env.RELEASE_NOTES,
              head: process.env.RELEASE_BRANCH,
              base: 'main',
              maintainer_can_modify: true,
            })
            core.info(`Created release-to-main PR: ${pr.html_url}`)
      - name: Report post-release PR failure
        if: failure()
        run: |
          echo "::warning::Post-release PR creation failed. Inspect existing release-to-main PRs and retry only this job; do not rerun or undo publication."
